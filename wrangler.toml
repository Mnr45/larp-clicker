name = "larp-clicker-cloudflare"
main = "src/index.js"
compatibility_date = "2026-11-18"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "larp-clicker-db"
database_id = "REMPLACE_PAR_LE_DATABASE_ID"

[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
